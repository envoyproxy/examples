services:

  kafka-client:
    build:
      context: .
      dockerfile: Dockerfile-kafka
    restart: "no"
    deploy:
      replicas: 0

  proxy:
    build:
      context: .
      dockerfile: ../shared/envoy/Dockerfile
      args:
        ENVOY_VARIANT: contrib-dev
    ports:
    - "${PORT_PROXY:-10000}:10000"
    - "${PORT_ADMIN:-8001}:8001"

  kafka-server:
    build:
      context: .
      dockerfile: Dockerfile-kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-server:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    environment:
      # KRaft single-node: this broker is also the controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-server:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # External listener for client traffic (goes through Envoy), internal for
      # inter-broker, controller for the KRaft quorum.
      KAFKA_LISTENERS: INTERNAL://kafka-server:9092,EXTERNAL://kafka-server:10000,CONTROLLER://kafka-server:9093
      # Advertised EXTERNAL points at Envoy so clients discover the broker through it.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-server:9092,EXTERNAL://proxy:10000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
