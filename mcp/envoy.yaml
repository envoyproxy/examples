admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: mcp
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mcp
          # The MCP method and tool that the MCP filter read from the request body, and the REST
          # request that the bridge made of it.
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "%DYNAMIC_METADATA(envoy.filters.http.mcp:method)% \
                    %DYNAMIC_METADATA(envoy.filters.http.mcp:params:name)% -> %REQ(:METHOD)% %REQ(:PATH)% \
                    %RESPONSE_CODE% %RESPONSE_CODE_DETAILS%\n"
          route_config:
            name: rest
            virtual_hosts:
            - name: rest
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: rest
          http_filters:
          # Parses the JSON-RPC body of each request, and rejects requests that are not MCP. At
          # protocol version 2026-07-28, it also checks the MCP headers against the body, and that
          # params._meta has the protocol version and the client capabilities.
          - name: envoy.filters.http.mcp
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.mcp.v3.Mcp
              traffic_mode: REJECT_NO_MCP
              attribute_source: BODY
              request_storage_mode: DYNAMIC_METADATA
              max_supported_protocol_version: "2026-07-28"
          # Serves the REST API as an MCP server: answers server/discover and tools/list itself, from
          # this configuration, and transcodes each tools/call into a REST request, and the REST
          # response into the tool's result.
          - name: envoy.filters.http.mcp_json_rest_bridge
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.mcp_json_rest_bridge.v3.McpJsonRestBridge
              request_storage_mode: DYNAMIC_METADATA
              server_info:
                max_supported_protocol_version: "2026-07-28"
              tool_config:
                tool_list_local: {}
                tools:
                # {city} is filled from the arguments, and the other arguments become the query.
                - name: get_weather
                  http_rule:
                    get: /v1/weather/{city}
                  tool_list_config:
                    title: Weather
                    description: The current weather in a city.
                    input_schema: >-
                      {"type": "object", "properties": {"city": {"type": "string"},
                      "units": {"type": "string", "enum": ["metric", "imperial"]}}, "required": ["city"]}
                # body "*": the arguments are sent as the JSON body.
                - name: create_order
                  http_rule:
                    post: /v1/orders
                    body: "*"
                  tool_list_config:
                    title: Create an order
                    description: Creates an order for an item.
                    input_schema: >-
                      {"type": "object", "properties": {"item": {"type": "string"},
                      "quantity": {"type": "integer"}}, "required": ["item", "quantity"]}
                # The REST API answers with server-sent events. The bridge streams the result to the
                # client as they arrive, in a chunked JSON response, with each event as a text item.
                - name: stream_text
                  http_rule:
                    get: /v1/stream/text
                  text_content_streaming_enabled: true
                  tool_list_config:
                    title: Stream text
                    description: Streams an answer in several parts.
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: rest
    type: STRICT_DNS
    load_assignment:
      cluster_name: rest
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: rest
                port_value: 8080
