# The REST backend of the mcp sandbox: the MCP JSON-REST bridge end-to-end test, at MCP protocol
# version 2026-07-28. The official MCP Python SDK (and raw HTTP) in a client, Envoy, and a REST
# backend:
#
#   rest-client -> envoy:10000 (mcp -> mcp_json_rest_bridge -> router) -> rest-server:8000
#               -> envoy:10001 (mcp_json_rest_bridge -> router)       -> rest-server:8000
#
# From this directory:
#
#   docker compose up --build -d
#   docker compose exec rest-client python -u docker/client_entrypoint.py
#   docker compose down -v
#
# Reuses the MCP backend's Python image (../docker). See README.md.

name: mcp-rest-e2e

# Where the services find each other, and the run directory that they share.
x-e2e-environment: &e2e-environment
  ENVOY_HOST: envoy
  ENVOY_PORT: "10000"
  ENVOY_BRIDGE_ONLY_PORT: "10001"
  ENVOY_ADMIN_PORT: "9901"
  REST_SERVER_HOST: rest-server
  REST_SERVER_PORT: "8000"
  E2E_RUN_DIR: /e2e-run

# The test's sources, the MCP backend's included, read-only, and the run directory: a volume, or
# with RUN_DIR set, that host directory.
x-e2e-volumes: &e2e-volumes
- ..:/e2e:ro
- ${RUN_DIR:-run}:/e2e-run

# The Python image of the client and the REST server: mcp==2.2.0, and its uvicorn.
x-python-service: &python-service
  build: ../docker
  image: envoy-mcp-e2e-python:mcp-2.2.0
  # The image is built here, from ../docker, and never pulled: no registry has it.
  pull_policy: build
  # An init process that passes on signals, so that the service stops at once.
  init: true
  volumes: *e2e-volumes
  working_dir: /e2e/rest_backend

services:
  rest-server:
    <<: *python-service
    environment:
      <<: *e2e-environment
    command: ["sh", "docker/server_entrypoint.sh"]
    healthcheck:
      # A connection with no request, so that health checks are not in the request log.
      test:
      - CMD
      - python
      - -c
      - import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['REST_SERVER_PORT'])), timeout=2).close()
      interval: 1s
      timeout: 3s
      retries: 30

  envoy:
    # Envoy with envoy.yaml built in, from envoyproxy/envoy:dev by default, as for the MCP backend.
    # ENVOY_IMAGE and ENVOY_VARIANT select another image to build from: see ../README.md.
    build:
      context: .
      dockerfile: ../../shared/envoy/Dockerfile
      target: envoy-admin
      args:
        ENVOY_IMAGE: ${ENVOY_IMAGE:-envoyproxy/envoy}
        ENVOY_VARIANT: ${ENVOY_VARIANT:-dev}
        ENVOY_ADMIN_PORT: "9901"
    depends_on:
      rest-server:
        condition: service_healthy
    # One worker, access log entries written out every 200 ms, and Envoy's own log in the run
    # directory, with the debug lines of the bridge (component filter), the router (router) and the
    # MCP filter (mcp): the client quotes a failed case's lines from it. Envoy runs as the image's
    # non-root envoy user, and writes both logs into the run directory, which
    # docker/server_entrypoint.sh makes writable for it.
    command: ["envoy", "-c", "/etc/envoy.yaml", "-l", "${LOG_LEVEL:-info}",
              "--component-log-level", "filter:debug,router:debug,mcp:debug",
              "--log-path", "/e2e-run/envoy.log", "--concurrency", "1", "--disable-hot-restart",
              "--file-flush-interval-msec", "200"]
    volumes:
    - ${RUN_DIR:-run}:/e2e-run

  rest-client:
    <<: *python-service
    depends_on:
      rest-server:
        condition: service_healthy
      # The client waits for Envoy's /ready itself.
      envoy:
        condition: service_started
    environment:
      <<: *e2e-environment
      # Comma-separated case names or prefixes to run (ONLY), or not to run (SKIP_CASES).
      ONLY: "${ONLY:-}"
      SKIP_CASES: "${SKIP_CASES:-}"
      # strict: known-gap (compliance) failures fail the run too.
      COMPLIANCE: "${COMPLIANCE:-}"
    # The client stays up: the tests run in it, with docker compose exec.
    command: ["sleep", "infinity"]

volumes:
  run: {}
