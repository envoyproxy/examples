name: Lint

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: >-
    ${{ github.event.inputs.head_ref || github.run_id }}


jobs:
  lint:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'envoyproxy'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Check module versions
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re

        version = Path("VERSION").read_text().strip()
        assert re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-dev)?", version), "Invalid VERSION"
        version = version.removesuffix("-dev")
        for path in ("MODULE.bazel", "filter-cc/MODULE.bazel", "wasm-cc/MODULE.bazel"):
            content = Path(path).read_text()
            module = re.search(r"^module\(\n.*?^\)", content, re.MULTILINE | re.DOTALL)
            assert module, f"{path}: missing module"
            versions = re.findall(r'version\s*=\s*"([^"]+)"', module.group())
            assert versions == [version], f"{path}: module version must be {version}"
            if path == "MODULE.bazel":
                for name in ("envoy-example-filter-cc", "envoy-example-wasm-cc"):
                    deps = re.findall(rf'bazel_dep\(name = "{name}", version = "([^"]+)"\)', content)
                    assert deps == [version], f"{path}: {name} version must be {version}"
        PY
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - run: |
        pip install -r ./.github/workflows/requirements.txt
        envoy.code.check . -c glint python_flake8 shellcheck yamllint -x single-page-app/_github-clusters.yml
    - name: Lint compose host ports
      run: bazel test //:lint_ports //:port_harness_test
