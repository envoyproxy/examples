name: Verify/Examples

permissions:
  contents: read

on:
  workflow_call:


jobs:
  examples:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
    - uses: envoyproxy/toolshed/actions/bind-mounts@598eacce15ab5f208102a2fd5669292868002701  # v0.4.0
      with:
        mounts: |
          - src: /mnt/docker
            target: /var/lib/docker
            rm: true
            command-pre: sudo systemctl stop docker
            command-post: sudo systemctl start docker
          - src: /mnt/runner-cache
            target: /home/runner/.cache
            chown: "runner:runner"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: examples
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: envoyproxy/envoy
        path: envoy
    - run: |
        TEMPDIR=/cache/docker
        sudo mkdir -p "${TEMPDIR}"
        # Exceed the default 50%-RAM cap, leaving ~2 GiB on a 16 GiB runner.
        # This is a ceiling, not a reservation; free memory before archiving.
        sudo mount -t tmpfs -o size=14g none "$TEMPDIR"
        sudo chown runner "$TEMPDIR"
    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: /cache/docker
        key: ${{ runner.os }}-docker-${{ hashFiles('examples/**/Dockerfile*') }}
    - run: |
        TEMPDIR=/cache/docker
        sudo mkdir -p /var/lib/docker-examples
        zstd --stdout -d "${TEMPDIR}/docker.tar.zst" | sudo tar --warning=no-timestamp -xf - -C /var/lib/docker-examples
        sudo rm "${TEMPDIR}/docker.tar.zst"
      if: steps.cache.outputs.cache-hit == 'true'
    - run: |
        sudo du -ch /var/lib/docker | grep total
        sudo du -ch /var/lib/docker-examples | grep total
        sudo df -h
    - uses: actions/cache@v6
      with:
        path: /home/runner/.cache
        key: ${{ runner.os }}-bazel-${{ hashFiles('examples/**/BUILD', 'examples/**/*bzl', 'examples/WORKSPACE') }}

    - name: RBE auth check
      id: rbe
      if: github.event_name == 'pull_request'
      uses: envoyproxy/toolshed/actions/github/container/auth@7a3512de44dc14c333398d1b262001eeb6864eee
      with:
        container: hello-world
    - name: Configure repo Bazel settings (CI)
      working-directory: examples
      run: |
        cp .github/workflows/repo.bazelrc repo.bazelrc
        mkdir -p bazel/
        cp .github/workflows/engflow-bazel-credential-helper.sh bazel/
    - name: Configure repo Bazel settings (RBE/BES)
      if: >-
        github.event_name != 'pull_request'
        || steps.rbe.outputs.authorized == 'true'
      working-directory: examples
      run: |
        cat >> repo.bazelrc <<'EOF'
        common --config=rbe
        common --config=bes
        EOF
        cat repo.bazelrc
    - run: |
        docker pull envoyproxy/envoy:dev
        DEV_CONTAINER_ID=$(docker inspect --format='{{.Id}}' envoyproxy/envoy:dev)
        echo "DEV_CONTAINER_ID=${DEV_CONTAINER_ID}" >> $GITHUB_ENV
    - run: |
        export UID
        printf '%s\n' 'common --config=ci' >> repo.bazelrc
        docker compose run --quiet --quiet-pull --quiet-build examples bash -c '
          bazel test ${BAZEL_BUILD_EXTRA_OPTIONS} --config=examples //:verify_examples --test_output=errors
          result=$?
          mkdir -p port-manifests
          cp bazel-testlogs/*_result/test.outputs/*.ports.json port-manifests/ 2>/dev/null || true
          [[ "$result" == 0 ]] || exit "$result"
          bazel test ${BAZEL_BUILD_EXTRA_OPTIONS} --config=examples //:port_collision_test --test_output=errors --nocache_test_results
        '
      working-directory: examples
      env:
        DOCKER_BUILDKIT: 1
        COMPOSE_BAKE: true
        BUILDKIT_PROGRESS: quiet
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload port manifests
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: example-port-manifests
        path: examples/port-manifests/*.ports.json

    - name: Free memory before caching
      if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      continue-on-error: true
      working-directory: examples
      run: |
        free -h
        docker compose run --rm examples bazel shutdown || true
        docker compose down --remove-orphans || true
        sync
        echo 3 | sudo tee /proc/sys/vm/drop_caches
        free -h

    - id: archive
      continue-on-error: true
      run: |
        TEMPDIR=/cache/docker
        sudo du -sh /var/lib/docker-examples
        df -h /cache/docker
        sudo du -sh /var/lib/docker-examples/* | sort -h | tail -n 20
        # TODO: Prune buildkit/dangling layers through the owning daemon, not the offline store.
        sudo tar cf - -C /var/lib/docker-examples . | zstd - -q -T0 -o "${TEMPDIR}/docker.tar.zst"
        ls -alh "${TEMPDIR}/docker.tar.zst"
        ARCHIVE_SIZE=$(stat -c %s "${TEMPDIR}/docker.tar.zst")
        echo "::notice::Docker cache archive size: $(numfmt --to=iec-i --suffix=B "$ARCHIVE_SIZE") ($ARCHIVE_SIZE bytes)"
        if (( ARCHIVE_SIZE > 9 * 1024 * 1024 * 1024 )); then
          echo "::warning::Docker cache archive exceeds 9 GiB, approaching the 10 GB per-entry cache limit."
        fi
      if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
    - uses: actions/cache/save@v6
      if: >-
        steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        && steps.archive.outcome == 'success'
      continue-on-error: true
      with:
        path: /cache/docker
        key: ${{ runner.os }}-docker-${{ hashFiles('examples/**/Dockerfile*') }}
