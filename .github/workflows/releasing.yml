name: Releasing CI

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  _TS_0: &ts-should-run envoyproxy/toolshed/actions/github/should-run@e8ab1b7c39d474eadc1b9340055df55407d2c77e  # actions-v0.4.33

jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
    - name: Check release machinery changes
      id: filter
      uses: *ts-should-run
      with:
        config: |
          paths:
          - .github/workflows/_release.yml
          - .github/workflows/release.yml
          - .github/workflows/publish.yml
          - .github/workflows/releasing.yml
          - .github/workflows/prepare_dev.sh
          - VERSION

  release:
    needs: request
    if: fromJSON(needs.request.outputs.run || 'false')
    uses: ./.github/workflows/_release.yml
    with:
      action: release
      dry-run: true
      committer-name: CI TESTING
      committer-email: ci-testing@does.not.exist
