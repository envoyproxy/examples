admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: ai_gateway
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ai_gateway
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "%FILTER_STATE(envoy.ai.model.request:PLAIN)% -> \
                    %UPSTREAM_CLUSTER% %REQ(:PATH)% %RESPONSE_CODE% %RESPONSE_CODE_DETAILS%\n"
          route_config:
            name: model_routes
            virtual_hosts:
            - name: ai_gateway
              domains: ["*"]
              routes:
              - name: openai
                match:
                  path: /v1/chat/completions
                  filter_state:
                  - key: envoy.ai.model.request
                    string_match: {prefix: gpt-}
                route:
                  cluster: openai
                typed_per_filter_config:
                  transcode:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
              - name: anthropic
                match:
                  path: /v1/chat/completions
                  filter_state:
                  - key: envoy.ai.model.request
                    string_match: {prefix: claude-}
                route:
                  cluster: anthropic
                  prefix_rewrite: /v1/messages
                typed_per_filter_config:
                  transcode:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: ANTHROPIC_MESSAGES}
              - name: gemini
                match:
                  path: /v1/chat/completions
                  filter_state:
                  - key: envoy.ai.model.request
                    string_match: {prefix: gemini-}
                route:
                  cluster: gemini
                typed_per_filter_config:
                  transcode:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: GEMINI_GENERATE_CONTENT}
              # Every chat request starts on this route, as its model is only known once its body is
              # read. It stays here, and is answered locally, when no route above serves the model.
              - name: unknown_model
                match:
                  path: /v1/chat/completions
                direct_response:
                  status: 404
                  body:
                    inline_string: >-
                      {"error": {"message": "No backend serves this model.", "type": "invalid_request_error",
                      "param": "model", "code": "model_not_found"}}
                response_headers_to_add:
                - header: {key: content-type, value: application/json}
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                typed_per_filter_config:
                  read_model:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
          http_filters:
          # Stores the request's model as the envoy.ai.model.request filter state object, and forwards
          # the body as received.
          - name: read_model
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling:
                reserialize_body: DISABLE
              filters:
              - name: envoy.http.ai_filters.request_info
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.request_info.v3.RequestInfo
          # Picks the route again, on the model.
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              clear_route_cache: true
          # Transcodes via the canonical form, OpenAI Chat Completions: the first transcoder converts
          # the route's request API, the second its response API.
          - name: transcode
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {}
              filters:
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: TO_IR
                  response_handling: FROM_IR
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: FROM_IR
                  response_handling: TO_IR
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # One cluster for every provider's mock, which serves that provider's API.
  clusters:
  - name: openai
    type: STRICT_DNS
    load_assignment:
      cluster_name: openai
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: openai
                port_value: 8080
  - name: anthropic
    type: STRICT_DNS
    load_assignment:
      cluster_name: anthropic
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: anthropic
                port_value: 8080
  - name: gemini
    type: STRICT_DNS
    load_assignment:
      cluster_name: gemini
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: gemini
                port_value: 8080
