admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: ai_gateway
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ai_gateway
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "%FILTER_STATE(envoy.ai.model.request:PLAIN)% -> \
                    %REQ(:AUTHORITY)%%REQ(:PATH)% %RESPONSE_CODE% %RESPONSE_CODE_DETAILS%\n"
          route_config:
            name: model_routes
            virtual_hosts:
            - name: ai_gateway
              domains: ["*"]
              # The AI Protocol Manager cannot read a compressed response, and no provider is sent a
              # credential the client sent.
              request_headers_to_remove: [accept-encoding, authorization, x-api-key, x-goog-api-key]
              routes:
              # Only a request read_model has parsed has a model, and it parses only the requests of
              # the chat_completions route below, so these routes need no path of their own.
              - name: openai
                match:
                  prefix: /
                  filter_state:
                  - key: envoy.ai.model.request
                    string_match: {prefix: gpt-}
                route:
                  cluster: dynamic_forward_proxy_cluster
                  host_rewrite_literal: api.openai.com
                  timeout: 120s
                typed_per_filter_config:
                  transcode:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                  openai_key: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}
              - name: anthropic
                match:
                  prefix: /
                  filter_state:
                  - key: envoy.ai.model.request
                    string_match: {prefix: claude-}
                route:
                  cluster: dynamic_forward_proxy_cluster
                  host_rewrite_literal: api.anthropic.com
                  path_rewrite: /v1/messages
                  timeout: 120s
                request_headers_to_add:
                - header: {key: anthropic-version, value: "2023-06-01"}
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                typed_per_filter_config:
                  transcode:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: ANTHROPIC_MESSAGES}
                  anthropic_key: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}
              - name: vertex
                match:
                  prefix: /
                  filter_state:
                  - key: envoy.ai.model.request
                    string_match: {prefix: gemini-}
                route:
                  cluster: dynamic_forward_proxy_cluster
                  host_rewrite_literal: aiplatform.googleapis.com
                  timeout: 120s
                  # The transcoder has set the Gemini API path, /v1beta/models/{model}:generateContent
                  # or :streamGenerateContent?alt=sse; this nests the model under Vertex AI's project and
                  # location, which the proxy fills in from its environment when it starts.
                  regex_rewrite:
                    pattern: {regex: ^/v1beta/}
                    substitution: /v1/projects/VERTEX_PROJECT/locations/VERTEX_LOCATION/publishers/google/
                typed_per_filter_config:
                  transcode:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: GEMINI_GENERATE_CONTENT}
                  vertex_key: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}
              # Every request starts on this route, as its model is only known once its body is read.
              # It stays here, and is answered locally, when no route above serves the model.
              - name: chat_completions
                match:
                  path: /v1/chat/completions
                direct_response:
                  status: 404
                  body:
                    inline_string: >-
                      {"error": {"message": "No backend serves this model.", "type": "invalid_request_error",
                      "param": "model", "code": "model_not_found"}}
                response_headers_to_add:
                - header: {key: content-type, value: application/json}
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                typed_per_filter_config:
                  read_model:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
          http_filters:
          # Stores the request's model as the envoy.ai.model.request filter state object, and forwards
          # the body as received.
          - name: read_model
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling:
                reserialize_body: DISABLE
              filters:
              - name: envoy.http.ai_filters.request_info
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.request_info.v3.RequestInfo
          # Picks the route again, on the model.
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              clear_route_cache: true
          # Transcodes via the canonical form, OpenAI Chat Completions: the first transcoder converts
          # the route's request API, the second its response API.
          - name: transcode
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {}
              filters:
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: TO_IR
                  response_handling: FROM_IR
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: FROM_IR
                  response_handling: TO_IR
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              # Each sets one provider's key, from the secrets below, on the requests of the routes that
              # enable it: as upstream filters, they are created once the model's route is picked.
              upstream_http_filters:
              - name: openai_key
                disabled: true
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                  credential:
                    name: envoy.http.injected_credentials.generic
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                      credential: {name: openai_api_key}
                      header_value_prefix: "Bearer "
              - name: anthropic_key
                disabled: true
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                  credential:
                    name: envoy.http.injected_credentials.generic
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                      credential: {name: anthropic_api_key}
                      header: x-api-key
              - name: vertex_key
                disabled: true
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                  credential:
                    name: envoy.http.injected_credentials.generic
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                      credential: {name: vertex_api_key}
                      header: x-goog-api-key
              - name: envoy.filters.http.upstream_codec
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec

  secrets:
  - name: openai_api_key
    generic_secret: {secret: {environment_variable: OPENAI_API_KEY}}
  - name: anthropic_api_key
    generic_secret: {secret: {environment_variable: ANTHROPIC_API_KEY}}
  - name: vertex_api_key
    generic_secret: {secret: {environment_variable: VERTEX_API_KEY}}

  clusters:
  # One cluster for every provider. It resolves and connects to the host the route rewrites the
  # request to, with that host as the TLS SNI and the name to validate the certificate against.
  - name: dynamic_forward_proxy_cluster
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: dynamic_forward_proxy_cache_config
          dns_lookup_family: V4_ONLY
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
