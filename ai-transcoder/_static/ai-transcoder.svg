<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 672" width="940" height="672" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">One OpenAI endpoint, three providers: Envoy routes on the model and transcodes each request</title>
  <desc id="desc">An OpenAI client sends POST /v1/chat/completions to Envoy. The json_to_metadata filter copies the request's model into dynamic metadata, and the routes match gpt-*, claude-* and gemini-* models to OpenAI, Anthropic and Vertex AI; any other model gets a local 404. The AI Protocol Manager's transcoders convert the request into OpenAI Chat Completions, Anthropic Messages or Gemini GenerateContent, and a single dynamic forward proxy cluster sends it over TLS to api.openai.com, api.anthropic.com or aiplatform.googleapis.com. Responses, JSON or SSE, are transcoded back into the OpenAI format.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="939" height="671" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Client -->
  <rect x="219" y="20" width="340" height="96" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="235" y="42"><tspan font-size="14" font-weight="700" fill="#0f172a">Client</tspan><tspan dx="8" font-size="12" fill="#64748b">OpenAI SDK or curl</tspan></text>
  <rect x="231" y="52" width="316" height="56" rx="6" fill="#f1f5f9"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#334155">
    <text x="243" y="70">POST /v1/chat/completions</text>
    <text x="243" y="86">{"model": "claude-haiku-4-5",</text>
    <text x="243" y="102">&#160;"messages": [...]}</text>
  </g>

  <line x1="375" y1="116" x2="375" y2="186" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <line x1="403" y1="148" x2="403" y2="118" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="367" y="136" font-size="12" text-anchor="end" fill="#475569">OpenAI request</text>
  <text x="411" y="136" font-size="12" fill="#6d28d9">OpenAI response</text>

  <!-- Envoy -->
  <rect x="20" y="148" width="900" height="350" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="174" font-size="16" font-weight="700" fill="#0f172a">Envoy</text>
  <text x="904" y="174" font-size="12" text-anchor="end" fill="#64748b">listener :10000</text>

  <!-- json_to_metadata -->
  <rect x="36" y="188" width="706" height="52" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="389" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" text-anchor="middle" fill="#334155">json_to_metadata</text>
  <text x="389" y="228" font-size="12.5" text-anchor="middle" fill="#0f172a">copies the body's "model" into dynamic metadata, and clears the route cache</text>

  <!-- Routes -->
  <path d="M389 240V256M149 256H830" fill="none" stroke="#475569" stroke-width="1.6"/>
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)">
    <line x1="149" y1="256" x2="149" y2="276"/>
    <line x1="389" y1="256" x2="389" y2="276"/>
    <line x1="629" y1="256" x2="629" y2="276"/>
    <line x1="830" y1="256" x2="830" y2="276"/>
  </g>
  <text x="509" y="250" font-size="12" text-anchor="middle" fill="#64748b">routes · match on model</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="79" y="278" width="140" height="34" rx="17" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="149" y="299.5" fill="#115e59">gpt-*</text>
    <rect x="319" y="278" width="140" height="34" rx="17" fill="#fbeee6" stroke="#c2410c" stroke-width="1.5"/>
    <text x="389" y="299.5" fill="#9a3412">claude-*</text>
    <rect x="559" y="278" width="140" height="34" rx="17" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="629" y="299.5" fill="#1e40af">gemini-*</text>
  </g>
  <rect x="770" y="278" width="120" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="830" y="299.5" font-size="12" text-anchor="middle" fill="#475569">anything else</text>

  <line x1="149" y1="312" x2="149" y2="336" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
  <line x1="389" y1="312" x2="389" y2="336" stroke="#c2410c" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <line x1="629" y1="312" x2="629" y2="336" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="830" y1="312" x2="830" y2="336" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <!-- Transcoders -->
  <rect x="36" y="338" width="226" height="54" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="276" y="338" width="226" height="54" rx="8" fill="#fbeee6" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="516" y="338" width="226" height="54" rx="8" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" text-anchor="middle" fill="#64748b">
    <text x="149" y="359">ai_protocol_manager</text>
    <text x="389" y="359">ai_protocol_manager</text>
    <text x="629" y="359">ai_protocol_manager</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <text x="149" y="379">OpenAI Chat Completions</text>
    <text x="389" y="379">Anthropic Messages</text>
    <text x="629" y="379">Gemini GenerateContent</text>
  </g>
  <rect x="756" y="338" width="148" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="830" y="360" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">local 404</text>
  <text x="830" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" text-anchor="middle" fill="#64748b">model_not_found</text>

  <line x1="149" y1="392" x2="149" y2="422" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
  <line x1="389" y1="392" x2="389" y2="422" stroke="#c2410c" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <line x1="629" y1="392" x2="629" y2="422" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <!-- One dynamic forward proxy cluster -->
  <rect x="36" y="408" width="868" height="74" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="49" y="424" width="200" height="34" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <text x="149" y="445.5">api.openai.com</text>
    <rect x="289" y="424" width="200" height="34" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    <text x="389" y="445.5">api.anthropic.com</text>
    <rect x="529" y="424" width="200" height="34" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="629" y="445.5">aiplatform.googleapis.com</text>
  </g>
  <text x="764" y="430" font-size="12.5" font-weight="700" fill="#0f172a">one cluster</text>
  <text x="764" y="447" font-size="11.5" fill="#334155">dynamic forward proxy</text>
  <text x="764" y="464" font-size="12" fill="#64748b">TLS · SNI = host</text>

  <!-- Requests down, responses back up -->
  <line x1="139" y1="458" x2="139" y2="526" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
  <line x1="379" y1="458" x2="379" y2="526" stroke="#c2410c" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <line x1="619" y1="458" x2="619" y2="526" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <g stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-violet)">
    <line x1="159" y1="528" x2="159" y2="460"/>
    <line x1="399" y1="528" x2="399" y2="460"/>
    <line x1="639" y1="528" x2="639" y2="460"/>
  </g>

  <!-- Providers -->
  <rect x="36" y="528" width="226" height="92" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="276" y="528" width="226" height="92" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="516" y="528" width="226" height="92" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <g font-size="14" font-weight="700" fill="#0f172a">
    <text x="50" y="552">OpenAI</text>
    <text x="290" y="552">Anthropic</text>
    <text x="530" y="552">Vertex AI (Gemini)</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#334155">
    <text x="50" y="574">POST /v1/chat/completions</text>
    <text x="50" y="592">authorization: Bearer ...</text>
    <text x="290" y="574">POST /v1/messages</text>
    <text x="290" y="592">x-api-key</text>
    <text x="290" y="610">anthropic-version</text>
    <text x="530" y="574">POST ...:generateContent</text>
    <text x="530" y="592">...:streamGenerateContent</text>
    <text x="530" y="610">x-goog-api-key</text>
  </g>

  <!-- Legend -->
  <line x1="36" y1="646" x2="64" y2="646" stroke="#475569" stroke-width="1.6"/>
  <text x="72" y="650" font-size="12" fill="#475569">request: OpenAI API in, the provider's API out</text>
  <line x1="400" y1="646" x2="428" y2="646" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="436" y="650" font-size="12" fill="#6d28d9">response, JSON or SSE, transcoded back into OpenAI's format</text>
</svg>
